[pytest]
# Run the test suite across all CPU cores by default (pytest-xdist). The tests are independent
# and each writes only under its own tmp_path, so they parallelise cleanly — this cuts the full
# run from ~3.3 min to ~45 s on a 16-core machine. Override with `-n 0` to run single-process
# (e.g. when stepping through a failure in a debugger, where parallel workers get in the way).
addopts = -n auto
testpaths = tests
